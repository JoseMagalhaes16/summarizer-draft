AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VetScribe - veterinary consult transcript to structured clinical note (Bedrock)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Deployment stage; used in resource names.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-opus-5-5
    Description: Bedrock model ID or inference-profile ID used for InvokeModel (confirm in the Bedrock console).
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Underlying foundation-model ID (BedrockModelId without the us./eu./global. prefix). Cross-region profiles route to other regions, so IAM allows any region for this model.
  BedrockStructuredMode:
    Type: String
    Default: output_config
    AllowedValues: [output_config, tool]
  BedrockEffort:
    Type: String
    Default: medium
    AllowedValues: [low, medium, high]
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin for the browser frontend (e.g. https://app.example.com).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Tracing: Active
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        APP_ENV: aws
        LLM_PROVIDER: bedrock
        STORAGE_BACKEND: dynamodb
        TABLE_NAME: !Ref Table
        JOB_DISPATCHER: lambda
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_STRUCTURED_MODE: !Ref BedrockStructuredMode
        BEDROCK_EFFORT: !Ref BedrockEffort
        BEDROCK_READ_TIMEOUT_S: "280"
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: vetscribe
        POWERTOOLS_METRICS_NAMESPACE: VetScribe

Resources:
  # ---------------------------------------------------------------- storage
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  WorkerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref CorsAllowOrigin]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      # Future: add a Cognito JWT authorizer here (spec: auth is out of scope for v1).

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vetscribe-${Stage}-api
      Description: VetScribe HTTP API (templates and notes)
      CodeUri: ../backend/src/
      Handler: vetscribe.handlers.api.lambda_handler
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/{proxy+}
            Method: ANY

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vetscribe-${Stage}-worker
      Description: VetScribe note generation worker (Bedrock InvokeModel)
      CodeUri: ../backend/src/
      Handler: vetscribe.handlers.worker.lambda_handler
      MemorySize: 1024
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 900
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt WorkerDeadLetterQueue.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Version: "2012-10-17"
          Statement:
            # Cross-region inference profiles route to other regions, hence the `*` region on the
            # foundation-model ARN. For `global.` profiles you additionally need
            #   arn:aws:bedrock:::foundation-model/<model id>
            # with Condition StringEquals aws:RequestedRegion = "unspecified".
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}

  # ---------------------------------------------------------------- logs
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vetscribe-${Stage}-api
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vetscribe-${Stage}-worker
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------- alarms
  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-worker-errors
      AlarmDescription: Worker Lambda reported errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WorkerDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-worker-dlq-depth
      AlarmDescription: Failed worker invocations are waiting in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (frontend VITE_API_BASE_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Description: DynamoDB table
    Value: !Ref Table
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  WorkerDeadLetterQueueUrl:
    Value: !Ref WorkerDeadLetterQueue
