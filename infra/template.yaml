AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VetScribe - veterinary consult transcript to structured clinical note (Bedrock)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Deployment stage; used in resource names.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-opus-5-5
    Description: Bedrock model ID or inference-profile ID used for InvokeModel (confirm in the Bedrock console).
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Underlying foundation-model ID (BedrockModelId without the us./eu./global. prefix). Cross-region profiles route to other regions, so IAM allows any region for this model.
  BedrockStructuredMode:
    Type: String
    Default: output_config
    AllowedValues: [output_config, tool]
  BedrockEffort:
    Type: String
    Default: medium
    AllowedValues: [low, medium, high]
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin for the browser frontend (e.g. https://app.example.com).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to alarm notifications (leave empty for none).
  CreateEvalResultsBucket:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create a private S3 bucket for evaluation results (written by the eval CLI/CI, read by the API).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365]

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  CreateEvalBucket: !Equals [!Ref CreateEvalResultsBucket, "true"]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Tracing: Active
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        APP_ENV: aws
        LLM_PROVIDER: bedrock
        STORAGE_BACKEND: dynamodb
        TABLE_NAME: !Ref Table
        JOB_DISPATCHER: lambda
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_STRUCTURED_MODE: !Ref BedrockStructuredMode
        BEDROCK_EFFORT: !Ref BedrockEffort
        BEDROCK_READ_TIMEOUT_S: "240"
        STALE_GENERATION_SECONDS: "1200"
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: vetscribe
        POWERTOOLS_METRICS_NAMESPACE: VetScribe
        EVALS_ALLOW_TRIGGER: "false"

Resources:
  # ---------------------------------------------------------------- storage
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EvalResultsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateEvalBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  WorkerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref CorsAllowOrigin]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      # Future: add a Cognito JWT authorizer here (spec: auth is out of scope for v1).

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vetscribe-${Stage}-api
      Description: VetScribe HTTP API (templates and notes)
      CodeUri: ../backend/src/
      Handler: vetscribe.handlers.api.lambda_handler
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
          EVAL_STORE: !If [CreateEvalBucket, s3, file]
          EVAL_S3_BUCKET: !If [CreateEvalBucket, !Ref EvalResultsBucket, ""]
          EVAL_S3_PREFIX: evals/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
        - !If
          - CreateEvalBucket
          - S3ReadPolicy:
              BucketName: !Ref EvalResultsBucket
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/{proxy+}
            Method: ANY

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vetscribe-${Stage}-worker
      Description: VetScribe note generation worker (Bedrock InvokeModel)
      CodeUri: ../backend/src/
      Handler: vetscribe.handlers.worker.lambda_handler
      MemorySize: 1024
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 900
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt WorkerDeadLetterQueue.Arn
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: NoteTableReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
            # Cross-region inference profiles route to other regions, hence the `*` region on the
            # foundation-model ARN. For `global.` profiles you additionally need
            #   arn:aws:bedrock:::foundation-model/<model id>
            # with Condition StringEquals aws:RequestedRegion = "unspecified".
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}

  DlqHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vetscribe-${Stage}-dlq-handler
      Description: Marks notes whose generation invocation failed permanently as failed
      CodeUri: ../backend/src/
      Handler: vetscribe.handlers.dlq.lambda_handler
      MemorySize: 256
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref DlqHandlerLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: NoteTableReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
      Events:
        Dlq:
          Type: SQS
          Properties:
            Queue: !GetAtt WorkerDeadLetterQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---------------------------------------------------------------- logs
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vetscribe-${Stage}-api
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vetscribe-${Stage}-worker
      RetentionInDays: !Ref LogRetentionDays

  DlqHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vetscribe-${Stage}-dlq-handler
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------- alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub vetscribe-${Stage}-alarms
      KmsMasterKeyId: alias/aws/sns

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-worker-errors
      AlarmDescription: Worker Lambda reported errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-worker-dlq-depth
      AlarmDescription: Failed worker invocations are waiting in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  GenerationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-generation-failed
      AlarmDescription: Note generations are failing (custom metric GenerationFailed)
      Namespace: VetScribe
      MetricName: GenerationFailed
      Dimensions:
        - Name: service
          Value: vetscribe
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DlqHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub vetscribe-${Stage}-dlq-handler-errors
      AlarmDescription: The DLQ handler itself is failing; stuck notes may not be marked failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DlqHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  EvalResultsBucketName:
    Condition: CreateEvalBucket
    Description: S3 bucket for evaluation results (set EVAL_S3_BUCKET in the eval workflow)
    Value: !Ref EvalResultsBucket
  ApiUrl:
    Description: Base URL of the HTTP API (frontend VITE_API_BASE_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Description: DynamoDB table
    Value: !Ref Table
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  WorkerDeadLetterQueueUrl:
    Value: !Ref WorkerDeadLetterQueue
