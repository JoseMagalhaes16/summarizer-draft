[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetscribe"
version = "0.1.0"
description = "VetScribe backend: veterinary consultation transcript to structured clinical note"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.7",
  "aws-lambda-powertools>=3.0",
  "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "moto[dynamodb]>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[bedrock-runtime,dynamodb,lambda]>=1.35",
  "cfn-lint>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vetscribe"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore:No application metrics to publish:UserWarning"]

[tool.coverage.run]
source = ["vetscribe"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
